name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src evals tests scripts

      - name: Format check
        run: ruff format --check src evals tests scripts

      - name: Types
        continue-on-error: true # advisory until the codebase is fully annotated
        run: mypy

      - name: Tests
        run: pytest -q

      # The eval runs with the offline encoder, so it needs no secrets and no
      # network. It is a build gate, not a report: if a change makes clustering
      # worse on the labelled set, CI fails rather than quietly shipping a
      # regression that nobody would notice until the report looked wrong.
      - name: Clustering eval
        run: |
          python scripts/generate_fixtures.py
          python -m evals.run_eval --json eval.json
          python - <<'PY'
          import json, sys

          results = json.load(open("eval.json"))
          pipeline = next(v for k, v in results.items() if "lexical vectors" in k)
          baseline = next(v for k, v in results.items() if "baseline" in k)
          print("baseline :", baseline)
          print("pipeline :", pipeline)

          floors = {"homogeneity": 0.99, "completeness": 0.95, "v_measure": 0.97}
          failures = [
              f"{metric}={pipeline[metric]:.3f} below floor {floor}"
              for metric, floor in floors.items()
              if pipeline[metric] < floor
          ]
          if pipeline["v_measure"] <= baseline["v_measure"]:
              failures.append("pipeline no better than the baseline it replaces")
          if failures:
              sys.exit("clustering regression: " + "; ".join(failures))
          print("clustering quality within floors")
          PY

      - name: Pipeline smoke test
        run: rei run --from-file fixtures/slack_messages.json --offline --dry-run --db /tmp/ci.db
