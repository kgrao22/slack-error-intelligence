[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-error-intelligence"
version = "1.0.0"
description = "Semantic clustering and daily reporting for renewal-flow errors in Slack."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Krishna Rao" }]

# Deliberately small dependency surface: one HTTP client, one validation library,
# one numeric library, one CLI framework. Slack / Voyage / Anthropic are all plain
# JSON-over-HTTPS and are called through src/rei/http.py, which gives every
# provider the same retry, backoff and rate-limit policy. See ARCHITECTURE.md.
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "scikit-learn>=1.4",  # only used to cross-check evals/metrics.py in tests
    "markdown>=3.5",      # scripts/build_docs.py — Markdown to PDF
]

[project.scripts]
rei = "rei.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
# Deliberate typography in report output, not homoglyph mistakes.
allowed-confusables = ["×", "–"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.mypy]
python_version = "3.11"
packages = ["rei"]
mypy_path = "src"
ignore_missing_imports = true
